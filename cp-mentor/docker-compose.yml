services:
  mysql:
    image: mysql:8.0
    container_name: cpmentor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cpmentor
      MYSQL_USER: cpmentor
      MYSQL_PASSWORD: cpmentor
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - cpmentor-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cpmentor-mysql-data:
