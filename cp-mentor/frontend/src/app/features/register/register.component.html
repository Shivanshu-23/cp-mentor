<div class="page-fade-in auth-page">
  <div class="auth-border">
  <mat-card>
    <mat-card-header style="margin-bottom:24px">
      <mat-card-title class="gradient-text auth-title">Create Account</mat-card-title>
      <mat-card-subtitle>Join NovaCode and level up your problem solving</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="auth-input-glow">
      <form [formGroup]="form" (ngSubmit)="submit()">

        <mat-form-field appearance="outline" class="form-field-spaced">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username">
          <mat-icon matSuffix>person</mat-icon>
          <mat-error *ngIf="form.get('username')?.hasError('minlength')">Min 3 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field-spaced">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field-spaced-lg">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password"
                 [type]="hidePassword ? 'password' : 'text'"
                 autocomplete="new-password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-hint>Minimum 6 characters</mat-hint>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">Min 6 characters</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit"
                [disabled]="form.invalid || loading"
                class="auth-submit-btn" style="margin-top:8px">
          <mat-spinner *ngIf="loading" diameter="24" style="display:inline-block;margin-right:8px"></mat-spinner>
          {{ loading ? 'Creating account...' : 'Create Account' }}
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions class="auth-footer">
      <span>
        Already have an account?
        <a routerLink="/login" class="auth-footer-link"> Sign In</a>
      </span>
    </mat-card-actions>
  </mat-card>
  </div>
</div>
