<div class="page-fade-in" style="display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 64px);padding:24px">
  <mat-card style="width:100%;max-width:440px">
    <mat-card-header style="margin-bottom:24px">
      <mat-card-title class="gradient-text" style="font-size:26px;font-weight:800;letter-spacing:-0.5px">Create Account</mat-card-title>
      <mat-card-subtitle>Join AI CP Mentor and level up your problem solving</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">

        <mat-form-field appearance="outline" style="width:100%;margin-bottom:12px">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username">
          <mat-icon matSuffix>person</mat-icon>
          <mat-error *ngIf="form.get('username')?.hasError('minlength')">Min 3 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width:100%;margin-bottom:12px">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width:100%;margin-bottom:24px">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password"
                 [type]="hidePassword ? 'password' : 'text'"
                 autocomplete="new-password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-hint>Minimum 6 characters</mat-hint>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">Min 6 characters</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit"
                [disabled]="form.invalid || loading"
                style="width:100%;height:48px;font-size:16px;margin-top:8px">
          <mat-spinner *ngIf="loading" diameter="24" style="display:inline-block;margin-right:8px"></mat-spinner>
          {{ loading ? 'Creating account...' : 'Create Account' }}
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions style="text-align:center;padding:16px">
      <span style="color:#8b949e;font-size:14px">
        Already have an account?
        <a routerLink="/login" style="color:#58a6ff;text-decoration:none;font-weight:600"> Sign In</a>
      </span>
    </mat-card-actions>
  </mat-card>
</div>
