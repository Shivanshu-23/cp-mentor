<svg
  class="trie-svg"
  [attr.viewBox]="viewBox"
  [attr.height]="svgHeight"
  preserveAspectRatio="xMidYMin meet"
  role="img"
  aria-label="Trie visualization">

  <g *ngFor="let e of edges">
    <line [attr.x1]="e.x1" [attr.y1]="e.y1" [attr.x2]="e.x2" [attr.y2]="e.y2" class="trie-edge"></line>
    <text [attr.x]="(e.x1 + e.x2) / 2 + 6" [attr.y]="(e.y1 + e.y2) / 2" class="trie-edge-label">{{ e.label }}</text>
  </g>

  <g *ngFor="let n of laidOut" [attr.transform]="'translate(' + n.x + ',' + n.y + ')'">
    <circle [attr.class]="'trie-node tone-' + toneFor(n.id)" [class.is-end]="n.isEnd" [attr.r]="nodeR"></circle>
    <text class="trie-char" y="5" text-anchor="middle">{{ n.char || '•' }}</text>
  </g>
</svg>
