<svg
  class="tree-svg"
  [attr.viewBox]="viewBox"
  [attr.height]="svgHeight"
  preserveAspectRatio="xMidYMin meet"
  role="img"
  aria-label="Tree visualization">

  <line *ngFor="let e of edges()" [attr.x1]="e.x1" [attr.y1]="e.y1" [attr.x2]="e.x2" [attr.y2]="e.y2" class="tree-edge"></line>

  <g *ngFor="let n of laidOut" [attr.transform]="'translate(' + n.x + ',' + n.y + ')'">
    <circle [attr.class]="'tree-node tone-' + toneFor(n.id)" [attr.r]="nodeR"></circle>
    <text class="tree-value" y="5" text-anchor="middle">{{ n.value }}</text>
    <text class="tree-order" *ngIf="orderLabel(n.id) !== null" [attr.y]="-nodeR - 6" text-anchor="middle">{{ orderLabel(n.id) }}</text>

    <g *ngFor="let p of pointersAt(n.id); let pi = index" [attr.transform]="'translate(0,' + (nodeR + 16 + pi * 14) + ')'">
      <text class="tree-pointer" text-anchor="middle">{{ p.name }}</text>
    </g>
  </g>
</svg>
