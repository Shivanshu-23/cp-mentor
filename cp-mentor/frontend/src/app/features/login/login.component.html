<div style="display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 64px);padding:24px">
  <mat-card style="width:100%;max-width:420px">
    <mat-card-header style="margin-bottom:24px">
      <mat-card-title style="font-size:24px;font-weight:700">Sign In</mat-card-title>
      <mat-card-subtitle>Welcome back to AI CP Mentor</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">

        <mat-form-field appearance="outline" style="width:100%;margin-bottom:16px">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width:100%;margin-bottom:24px">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'" autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit"
                [disabled]="form.invalid || loading"
                style="width:100%;height:48px;font-size:16px">
          <mat-spinner *ngIf="loading" diameter="24" style="display:inline-block;margin-right:8px"></mat-spinner>
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions style="text-align:center;padding:16px">
      <span style="color:#8b949e;font-size:14px">
        Don't have an account?
        <a routerLink="/register" style="color:#58a6ff;text-decoration:none;font-weight:600"> Sign Up</a>
      </span>
    </mat-card-actions>
  </mat-card>
</div>
