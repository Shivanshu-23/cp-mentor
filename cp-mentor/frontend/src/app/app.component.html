<mat-toolbar>
  <a routerLink="/home" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px">
    <mat-icon style="color:#58a6ff">code</mat-icon>
    <span style="font-weight:700;letter-spacing:-0.5px">AI CP Mentor</span>
  </a>

  <span style="flex:1"></span>

  <a mat-button routerLink="/home" routerLinkActive="active-link">
    <mat-icon>home</mat-icon> Daily Problem
  </a>

  <ng-container *ngIf="isLoggedIn; else guestNav">
    <span style="color:#8b949e;margin:0 12px;font-size:14px">{{ username }}</span>
    <button mat-button (click)="logout()" style="color:#f85149">
      <mat-icon>logout</mat-icon> Logout
    </button>
  </ng-container>

  <ng-template #guestNav>
    <a mat-button routerLink="/login">Login</a>
    <a mat-raised-button color="primary" routerLink="/register" style="margin-left:8px">Sign Up</a>
  </ng-template>
</mat-toolbar>

<a mat-button routerLink="/company-tracker">
  <mat-icon>business</mat-icon> Company Tracker
</a>

<router-outlet></router-outlet>
