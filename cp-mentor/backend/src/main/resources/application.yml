server:
  port: ${PORT:8080}

spring:
  application:
    name: cp-mentor

  datasource:
    url: jdbc:h2:mem:cpmentor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

jwt:
  # Dev-only default so local startup needs no config — ALWAYS set JWT_SECRET in any shared/production environment.
  secret: ${JWT_SECRET:q6z/FQ8IwgZOdSM84R+oe068H8DP13ue2rmZor11UYlVVlhEZ8LIyWCpSDTUxr5569otzepV+cj1FySajgeC/A==}
  expiration: 86400000 # 24 hours

# Comma-separated list of allowed frontend origins for CORS. In production
# (e.g. Render), set ALLOWED_ORIGINS to your deployed Vercel URL.
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

# OpenAI — leave blank to use mock AI (no key needed to start)
openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
  base-url: https://api.openai.com

# YouTube — leave blank to use mock data
youtube:
  api-key: ${YOUTUBE_API_KEY:}
  base-url: https://www.googleapis.com/youtube/v3

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.cpmentor: DEBUG
    org.springframework.security: WARN

# Gemini AI (free tier — 15 req/min, 1M tokens/day) — leave blank to use mock AI (no key needed to start)
gemini:
  api-key: ${GEMINI_API_KEY:}

# Claude AI (optional)
claude:
  api-key: ${CLAUDE_API_KEY:}

