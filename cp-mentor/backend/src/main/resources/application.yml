server:
  port: ${PORT:8080}

spring:
  application:
    name: cp-mentor

  # Active profile selects the datasource: dev/prod → MySQL, test → in-memory H2.
  # Defaults to dev for local `mvn spring-boot:run` with no profile set.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Hibernate 6 defaults @Enumerated(STRING) to native MySQL ENUM columns;
        # keep it plain VARCHAR so it matches the Flyway-managed schema.
        type:
          preferred_enum_jdbc_type: VARCHAR

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

jwt:
  # Dev-only default so local startup needs no config — ALWAYS set JWT_SECRET in any shared/production environment.
  secret: ${JWT_SECRET:q6z/FQ8IwgZOdSM84R+oe068H8DP13ue2rmZor11UYlVVlhEZ8LIyWCpSDTUxr5569otzepV+cj1FySajgeC/A==}
  expiration: 86400000 # 24 hours

# Comma-separated list of allowed frontend origins for CORS. In production
# (e.g. Render), set ALLOWED_ORIGINS to your deployed Vercel URL.
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

# OpenAI — leave blank to use mock AI (no key needed to start)
openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
  base-url: https://api.openai.com

# LeetCode public profile shown on the dashboard — no key needed, public GraphQL API
leetcode:
  username: ${LEETCODE_USERNAME:shivanshu_23}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.cpmentor: DEBUG
    org.springframework.security: WARN

# Gemini AI (free tier — 15 req/min, 1M tokens/day) — leave blank to use mock AI (no key needed to start)
gemini:
  api-key: ${GEMINI_API_KEY:}

# Claude AI (optional)
claude:
  api-key: ${CLAUDE_API_KEY:}
