# Production (Render) — MySQL, connection details supplied entirely via env vars.
spring:
  datasource:
    url: ${DB_URL} # e.g. jdbc:mysql://<host>:3306/<db>?useSSL=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, not Hibernate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
